<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FC Evolution Dashboard - Advanced Search</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0f1115; color: #e0e0e0; padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: auto; padding-top: 20px; }
        
        /* Controls */
        .header-section { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        .controls { display: flex; gap: 12px; align-items: center; background: #1a1d23; padding: 18px; border-radius: 12px; border: 1px solid #2d323a; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        
        #search { flex-grow: 1; padding: 14px 20px; border-radius: 8px; border: 1px solid #3d4451; background: #0f1115; color: white; font-size: 1rem; outline: none; transition: 0.3s; }
        #search:focus { border-color: #00ffcc; box-shadow: 0 0 8px rgba(0, 255, 204, 0.2); }
        
        .btn { padding: 14px 28px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
        .btn-toggle { background: #00ffcc; color: #0f1115; }
        .btn-toggle.active { background: #ff4444; color: white; }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

        /* Table */
        table { width: 100%; border-collapse: collapse; background: #1a1d23; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        th, td { padding: 16px; border-bottom: 1px solid #2d323a; text-align: left; }
        th { background: #252932; color: #00ffcc; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.5px; }
        
        .expired-row { opacity: 0.35; }
        .active-row { border-left: 4px solid #00ffcc; }

        /* Playstyles */
        .icon-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .ps-icon { width: 38px; height: 38px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .plus-icon { border: 2px solid #ffcc00; border-radius: 6px; background: rgba(255, 204, 0, 0.15); padding: 1px; }
        
        .status-tag { font-size: 0.65rem; padding: 2px 8px; border-radius: 4px; background: #333; color: #888; margin-left: 10px; font-weight: normal; }
        .no-data { color: #444; font-size: 0.8rem; }
        
        .search-tip { font-size: 0.85rem; color: #888; margin-top: -10px; }
        b { color: #00ffcc; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h2 style="margin:0; font-weight: 300;">Evolution Tracker</h2>
        <div class="search-tip">Tip: Search <b>"Playstyles"</b></div>
    </div>
    
    <div class="controls">
        <input type="text" id="search" placeholder="Search by name or playstyle (e.g. 'intercept', 'technical+')..." onkeyup="filterTable()">
        <button id="toggleBtn" class="btn btn-toggle" onclick="toggleExpired()">Hide Expired</button>
    </div>

    <table id="evoTable">
        <thead>
            <tr>
                <th style="width: 35%;">Evolution Name</th>
                <th>Standard Playstyles</th>
                <th>Playstyles+ (Gold)</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    let hideExpiredState = false;
    let evolutionData = [];

    // All possible playstyle images
    const playstyleMap = {
        "Finesse Shot": { folder: "Finishing", file: "finesse_shot" },
        "Power Shot": { folder: "Finishing", file: "power_shot" },
        "Precision Header": { folder: "Finishing", file: "precision_header" },
        "Low Driven Shot": { folder: "Finishing", file: "low_driven_shot" },
        "Dead Ball": { folder: "Finishing", file: "dead_ball" },
        "Acrobatic": { folder: "Finishing", file: "acrobatic" },
        "Chip Shot": { folder: "Finishing", file: "chip_shot" },
        "Pinged Pass": { folder: "Passing", file: "pinged_pass" },
        "Incisive Pass": { folder: "Passing", file: "incisive_pass" },
        "Whipped Pass": { folder: "Passing", file: "whipped_pass" },
        "Tiki Taka": { folder: "Passing", file: "tiki_taka" },
        "Inventive": { folder: "Passing", file: "inventive" },
        "Long Ball Pass": { folder: "Passing", file: "long_ball_pass" },
        "Anticipate": { folder: "Defending", file: "anticipate" },
        "Intercept": { folder: "Defending", file: "intercept" },
        "Jockey": { folder: "Defending", file: "jockey" },
        "Block": { folder: "Defending", file: "block" },
        "Slide Tackle": { folder: "Defending", file: "slide_tackle" },
        "Aerial Fortress": { folder: "Defending", file: "aerial_fortress" },
        "Quick Step": { folder: "Physical", file: "quick_step" },
        "Bruiser": { folder: "Physical", file: "bruiser" },
        "Relentless": { folder: "Physical", file: "relentless" },
        "Enforcer": { folder: "Physical", file: "enforcer" },
        "Long Throw": { folder: "Physical", file: "long_throw" },
        "Rapid": { folder: "BallControl", file: "rapid" },
        "Technical": { folder: "BallControl", file: "technical" },
        "Trickster": { folder: "BallControl", file: "trickster" },
        "First Touch": { folder: "BallControl", file: "first_touch" },
        "Press Proven": { folder: "BallControl", file: "press_proven" },
        "Gamechanger": { folder: "Finishing", file: "gamechanger" },
        "Far Throw": { folder: "Goalkeeper", file: "far_throw" },
        "Cross Claimer": { folder: "Goalkeeper", file: "cross_claimer" },
        "Footwork": { folder: "Goalkeeper", file: "footwork" },
        "Rush Out": { folder: "Goalkeeper", file: "rush_out" },
        "Far Reach": { folder: "Goalkeeper", file: "far_reach" },
        "Deflector": { folder: "Goalkeeper", file: "deflector" }
    };

    // RAW DATA INJECTION (Automatically parses your long list)
    const rawInput = `Just Shoot	N/A	N/A	Expired
Footwork+	N/A	Footwork	Expired
Box Guardian	Quick Step	N/A	Expired
The Invisible Wall	Anticipate, Jockey, Press Proven, Bruiser	Anticipate	Expired
Complete Fnisher	Finesse Shot, Low Driven Shot	N/A	Expired
Bruiser+	N/A	Bruiser	Expired
Block+	N/A	Block	Expired
Tiki Taka+	N/A	Tiki Taka	Expired
Get your Protein	Quick Step, Bruiser, Enforcer, Relentless, Long Throw	Quick Step	Expired
Crowned Maestro	Incisive Pass, Technical, Low Driven Shot, First Touch	Tiki Taka, Incisive Pass	Expired
That Ball is Mine	Rapid, Technical, First Touch, Trickster, Gamechanger, Press Proven	Rapid	Expired
The Duck	Rapid, Finesse Shot, Technical, Incisive Pass	Quick Step	Expired
Make the Link	N/A	N/A	Expired
The Prince from Arenys	Incisive Pass, Tiki Taka, Technical, Press Proven, First Touch	Incisive Pass	Expired
Future Stars	N/A	N/A	Expired
Hold & Play	Intercept, Long Ball Pass	N/A	Expired
Finesse Shot	Finesse Shot	N/A	Expired
Jockey+	N/A	Jockey	Expired
Anticipate	Anticipate	N/A	Expired
Meeks Mode	Bruiser, Jockey, Quick Step, Anticipate, Slide Tackle	Bruiser	Expired
Incisive Pass+	N/A	Incisive Pass	Expired
Rapid+	N/A	Rapid	Expired
Long Ball Pass+	N/A	Long Ball Pass	Expired
Press Proven+	N/A	Press Proven	Expired
Pinged Pass+	N/A	Pinged Pass	Expired
Future No.1	Rush Out, Far Reach, Pinged Pass, Deflector	Rush Out	Expired
Anticipate+	N/A	Anticipate	Expired
Finesse Shot+	N/A	Finesse Shot	Expired
Quick Step+	N/A	Quick Step	Expired
The Tiki Tactician	Pinged Pass, Press Proven, First Touch, Tiki Taka, Technical, Finesse Shot	Tiki Taka	Expired
Line Breaker	Incisive Pass, Tiki Taka, Pinged Pass, Block	Incisive Pass	Expired
Creative Director	Tiki Taka, Pinged Pass, Incisive Pass, Technical, Long Ball Pass	Pinged Pass	Expired
Power Play	Low Driven Shot, Rapid, Tiki Taka, Finesse Shot, Technical, Trickster, Gamechanger	Low Driven Shot	Expired
Inside Edge	Low Driven Shot, Gamechanger, Technical, Tiki Taka, Incisive Pass	Finesse Shot	Expired
Winter Wall	Aerial Fortress, Intercept, Bruiser, Block, Slide Tackle	Aerial Fortress	Expired
Attacking Freeze	Bruiser, Jockey, Intercept, Block, Anticipate, Slide Tackle, Aerial Fortress	Bruiser	Expired
Passing Perfectionist	Incisive Pass, Tiki Taka, Pinged Pass, Long Ball Pass, Inventive, Whipped Pass	Incisive Pass	Expired
Bench Boost	Precision Header, Tiki Taka, Enforcer, Acrobatic, Aerial Fortress	Precision Header	1 Weeks
Max Skills	Quick Step, Trickster, Rapid, Technical	Quick Step, Trickster	1 Weeks
Midfield Dynamo	Pinged Pass, Anticipate, Inventive, Press Proven	Anticipate	1 Weeks
Going on an Adventure	Intercept, Dead Ball, Relentless	Whipped Pass	5 days
Instant Impact	Finesse Shot, Rapid	Finesse Shot	1 Weeks
Fantasy Staple	Rapid, Low Driven Shot, Finesse Shot, Enforcer, Aerial Fortress	Rapid	3 days
Fantasy FC Path	Low Driven Shot, First Touch, Finesse Shot, Power Shot	Low Driven Shot	2 days
Mindset Training	First Touch, Anticipate, Relentless, Pinged Pass	Press Proven	1 days`;

    function initData() {
        const lines = rawInput.trim().split('\n');
        lines.forEach(line => {
            const cols = line.split('\t');
            if (cols.length < 3) return;

            const name = cols[0].trim();
            const ps = cols[1].trim() === "N/A" ? [] : cols[1].split(',').map(s => s.trim());
            const plus = cols[2].trim() === "N/A" ? [] : cols[2].split(',').map(s => s.trim());
            const status = cols[3] ? cols[3].toLowerCase() : "";
            
            // Logic: If status is 'Expired', flag it.
            const isExpired = status.includes("expired");
            
            evolutionData.push({ name, ps, plus, isExpired });
        });
        renderTable();
    }

    function renderTable() {
        const body = document.getElementById('tableBody');
        body.innerHTML = "";
        
        evolutionData.forEach(evo => {
            const row = document.createElement('tr');
            if (evo.isExpired) row.classList.add('expired-row');
            else row.classList.add('active-row');
            
            const psHTML = evo.ps.length > 0 ? evo.ps.map(p => {
                const d = playstyleMap[p];
                return d ? `<img src="${d.folder}/${d.file}_standard.png" class="ps-icon" title="${p}">` : `<span>${p}</span>`;
            }).join('') : '<span class="no-data">N/A</span>';

            const plusHTML = evo.plus.length > 0 ? evo.plus.map(p => {
                const d = playstyleMap[p];
                return d ? `<img src="${d.folder}/${d.file}_plus.png" class="ps-icon plus-icon" title="${p}+">` : `<span>${p}+</span>`;
            }).join('') : '<span class="no-data">N/A</span>';

            const tag = evo.isExpired ? '<span class="status-tag">Expired</span>' : '';

            row.innerHTML = `
                <td><strong>${evo.name}</strong>${tag}</td>
                <td><div class="icon-row">${psHTML}</div></td>
                <td><div class="icon-row">${plusHTML}</div></td>
            `;
            body.appendChild(row);
        });
    }

    function toggleExpired() {
        hideExpiredState = !hideExpiredState;
        const btn = document.getElementById('toggleBtn');
        btn.innerText = hideExpiredState ? "Show All" : "Hide Expired";
        btn.classList.toggle('active', hideExpiredState);
        filterTable();
    }

    function filterTable() {
        const query = document.getElementById('search').value.toLowerCase().trim();
        const rows = document.getElementById('tableBody').getElementsByTagName('tr');
        
        // Advanced Search Logic
        const isPlusSearch = query.endsWith('+');
        const term = isPlusSearch ? query.slice(0, -1).trim() : query;

        evolutionData.forEach((evo, index) => {
            const row = rows[index];
            let matchesSearch = false;

            if (isPlusSearch) {
                // 1. Matches if evo name has the term (e.g. "Rapid+")
                // 2. Matches if ANY playstyle in the PLUS column matches the term
                matchesSearch = evo.name.toLowerCase().includes(query) || 
                                evo.plus.some(p => p.toLowerCase().includes(term));
            } else {
                // Standard search: Name, Base PS, or PS+
                matchesSearch = evo.name.toLowerCase().includes(query) || 
                                evo.ps.some(p => p.toLowerCase().includes(query)) ||
                                evo.plus.some(p => p.toLowerCase().includes(query));
            }
            
            const matchesExpiry = hideExpiredState ? !evo.isExpired : true;
            row.style.display = (matchesSearch && matchesExpiry) ? "" : "none";
        });
    }

    initData();
</script>

</body>
</html>

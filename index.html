    <style>
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0f1115; color: #e0e0e0; padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: auto; padding-top: 20px; }
        
        /* Controls */
        .header-section { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        .controls { display: flex; gap: 12px; align-items: center; background: #1a1d23; padding: 18px; border-radius: 12px; border: 1px solid #2d323a; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        
        #search { flex-grow: 1; padding: 14px 20px; border-radius: 8px; border: 1px solid #3d4451; background: #0f1115; color: white; font-size: 1rem; outline: none; transition: 0.3s; }
        #search:focus { border-color: #00ffcc; box-shadow: 0 0 8px rgba(0, 255, 204, 0.2); }
        
        .btn { padding: 14px 28px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
        .btn-toggle { background: #00ffcc; color: #0f1115; }
        .btn-toggle.active { background: #ff4444; color: white; }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

        /* Table */
        table { width: 100%; border-collapse: collapse; background: #1a1d23; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        th, td { padding: 16px; border-bottom: 1px solid #2d323a; text-align: left; }
        th { background: #252932; color: #00ffcc; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.5px; }
        
        .expired-row { opacity: 0.35; }
        .active-row { border-left: 4px solid #00ffcc; }

        /* Playstyles */
        .icon-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .ps-icon { width: 38px; height: 38px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .plus-icon { border: 2px solid #ffcc00; border-radius: 6px; background: rgba(255, 204, 0, 0.15); padding: 1px; }
        
        .status-tag { font-size: 0.65rem; padding: 2px 8px; border-radius: 4px; background: #333; color: #888; margin-left: 10px; font-weight: normal; }
        .expiry-tag { font-size: 0.65rem; padding: 2px 8px; border-radius: 4px; background: #0f2e1e; color: #00cc88; margin-left: 10px; font-weight: normal; border: 1px solid #00cc8840; }
        .expiry-urgent { background: #2e1a0f; color: #ff8c42; border-color: #ff8c4240; }
        .no-data { color: #444; font-size: 0.8rem; font-style: italic; }
        
        .search-tip { font-size: 0.85rem; color: #888; margin-top: -10px; }
        b { color: #00ffcc; }
    </style>
</head>

    function init() {
        // Here we can append any simple "N/A" evos from your list that don't need manual mapping
        const additionalNames = [
            "Make the Link", "Future Stars", "5* Skill Moves", "5* Weak Foot", 
            "FS Academy Club Legend Midfielders", "Future Stars Academy LB/RB First XI",
            "Skill Moves Upgrade", "Weak Foot Upgrade", "ST Roles++", "CB Roles++",
            "TOTY Icon", "TOTY Honourable Mentions", "ST to CAM", "CB to CDM"
        ];
        
        additionalNames.forEach(name => {
            if(!rawData.find(e => e.name === name)) {
                rawData.push({ name: name, ps: [], plus: [], exp: true });
            }
        });

        render();
    }

    function daysUntil(isoDate) {
        const msPerDay = 1000 * 60 * 60 * 24;
        const diff = new Date(isoDate + 'T23:59:59Z') - Date.now();
        return Math.ceil(diff / msPerDay);
    }

    function buildExpiryTag(isoDate) {
        const days = daysUntil(isoDate);
        if (days < 0)  return '<span class="status-tag">Expired</span>';
        if (days === 0) return '<span class="expiry-tag expiry-urgent">⏳ Expires today</span>';
        if (days <= 2)  return `<span class="expiry-tag expiry-urgent">⏳ ${days}d left</span>`;
        return `<span class="expiry-tag">⏳ ${days}d left</span>`;
    }

    // Returns true if this evo's name is itself a known playstyle name
    // A playstyle-named evo has a name that exactly matches a playstyle,
    // or is a playstyle name followed by '+' (e.g. "Rapid", "Rapid+")
    function isPlaystyleNamedEvo(evo) {
        if (evo.name in playstyleMap) return true;
        if (evo.name.endsWith('+') && evo.name.slice(0, -1).trim() in playstyleMap) return true;
        return false;
    }

    // Order (all groups preserve rawData order so newest synced = top):
    //   1. Normal-named active evos (newest first — the evos you actually care about)
    //   2. Playstyle-named evos (base + plus variants)
    //   3. Expired evos
    function getSortedData() {
        const normal  = [];
        const psGroup = [];
        const expired = [];

        rawData.forEach(evo => {
            if (evo.exp)                  { expired.push(evo);  return; }
            if (isPlaystyleNamedEvo(evo)) { psGroup.push(evo);  return; }
            normal.push(evo);
        });

        return [...normal, ...psGroup, ...expired];
    }

    function buildRow(evo) {
        const row = document.createElement('tr');
        row.className = evo.exp ? 'expired-row' : 'active-row';

        const psHTML = evo.ps.length > 0 ? evo.ps.map(p => {
            const d = playstyleMap[p];
            return d ? `<img src="${d.folder}/${d.file}_standard.png" class="ps-icon" title="${p}">` : `<span>${p}</span>`;
        }).join('') : '<span class="no-data">N/A</span>';

        const plusHTML = evo.plus.length > 0 ? evo.plus.map(p => {
            const d = playstyleMap[p];
            return d ? `<img src="${d.folder}/${d.file}_plus.png" class="ps-icon plus-icon" title="${p}+">` : `<span>${p}+</span>`;
        }).join('') : '<span class="no-data">N/A</span>';

        const tag = evo.exp
            ? '<span class="status-tag">Expired</span>'
            : evo.expires
                ? buildExpiryTag(evo.expires)
                : '';

        row.innerHTML = `
            <td><strong>${evo.name}</strong>${tag}</td>
            <td><div class="icon-row">${psHTML}</div></td>
            <td><div class="icon-row">${plusHTML}</div></td>
        `;
        return row;
    }

    function render() {
        const body = document.getElementById('tableBody');
        body.innerHTML = "";
        getSortedData().forEach(evo => body.appendChild(buildRow(evo)));
        filterTable();
    }

    function toggleExpired() {
        hideExpiredState = !hideExpiredState;
        const btn = document.getElementById('toggleBtn');
        btn.innerText = hideExpiredState ? "Show All" : "Hide Expired";
        btn.classList.toggle('active', hideExpiredState);
        filterTable();
    }

    function filterTable() {
        const query = document.getElementById('search').value.toLowerCase().trim();
        const rows = document.getElementById('tableBody').getElementsByTagName('tr');
        const sorted = getSortedData();

        const isPlusSearch = query.endsWith('+');
        const term = isPlusSearch ? query.slice(0, -1).trim() : query;

        sorted.forEach((evo, index) => {
            const row = rows[index];
            if (!row) return;
            let matchesSearch = false;

            if (isPlusSearch) {
                matchesSearch = evo.name.toLowerCase().includes(query) ||
                                evo.plus.some(p => p.toLowerCase().includes(term));
            } else {
                matchesSearch = evo.name.toLowerCase().includes(query) ||
                                evo.ps.some(p => p.toLowerCase().includes(query)) ||
                                evo.plus.some(p => p.toLowerCase().includes(query));
            }

            const matchesExpiry = hideExpiredState ? !evo.exp : true;
            row.style.display = (matchesSearch && matchesExpiry) ? "" : "none";
        });
    }

    init();
// press hide all Expired button
document.getElementById('toggleBtn').click();

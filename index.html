        .header-section { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        .controls { display: flex; gap: 12px; align-items: center; background: #1a1d23; padding: 18px; border-radius: 12px; border: 1px solid #2d323a; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        
        #search { flex-grow: 1; padding: 14px 20px; border-radius: 8px; border: 1px solid #3d4451; background: #0f1115; color: white; font-size: 1rem; outline: none; transition: 0.3s; }
        #search:focus { border-color: #00ffcc; box-shadow: 0 0 8px rgba(0, 255, 204, 0.2); }
        
        .btn { padding: 14px 28px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
        .btn-toggle { background: #00ffcc; color: #0f1115; }
        .btn-toggle.active { background: #ff4444; color: white; }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

        /* Table */
        table { width: 100%; border-collapse: collapse; background: #1a1d23; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        th, td { padding: 16px; border-bottom: 1px solid #2d323a; text-align: left; }
        th { background: #252932; color: #00ffcc; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.5px; }
        th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
        th.sortable:hover { background: #2e3440; color: #fff; }
        th.sort-asc::after  { content: ' ▲'; font-size: 0.65rem; opacity: 0.9; }
        th.sort-desc::after { content: ' ▼'; font-size: 0.65rem; opacity: 0.9; }
        
        .expired-row { opacity: 0.35; }
        .active-row { border-left: 4px solid #00ffcc; }

        /* Playstyles */
        .icon-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .ps-icon-wrap { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
        .ps-icon { width: 38px; height: 38px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .ps-cap { font-size: 0.6rem; color: #888; white-space: nowrap; }
        .plus-icon { border: 2px solid #ffcc00; border-radius: 6px; background: rgba(255, 204, 0, 0.15); padding: 1px; }
        
        .status-tag { font-size: 0.65rem; padding: 2px 8px; border-radius: 4px; background: #333; color: #888; font-weight: normal; display: inline-block; }
        .expiry-tag { font-size: 0.65rem; padding: 2px 8px; border-radius: 4px; background: #0f2e1e; color: #00cc88; font-weight: normal; border: 1px solid #00cc8840; display: inline-block; }
        .expiry-urgent { background: #2e1a0f; color: #ff8c42; border-color: #ff8c4240; }
        .no-data { color: #444; font-size: 0.8rem; font-style: italic; }
        .name-cell { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
        .pos-tag { font-size: 0.75rem; font-weight: 600; color: #a0cfff; background: #0d2040; border: 1px solid #1e4a8040; padding: 2px 8px; border-radius: 4px; }
        .rating-tag { font-size: 0.75rem; font-weight: 600; color: #ffd080; background: #2a1e00; border: 1px solid #6040004a; padding: 2px 8px; border-radius: 4px; }
        .boost-tag { font-size: 0.75rem; font-weight: 600; color: #7fffb2; background: #002a14; border: 1px solid #00ff6640; padding: 2px 8px; border-radius: 4px; }
        
        .search-tip { font-size: 0.85rem; color: #888; margin-top: -10px; }
        b { color: #00ffcc; }
    </style>
</head>

        { name: "The Eighth King of Rome", ps: ["Inventive"], plus: [], exp: true, pos: "ST", maxRating: 83, ovrBoost: "+5", ovrCap: 85 },  // AUTO-ADDED (expired)
        { name: "Iron Will", ps: [], plus: [], exp: true, maxRating: 82 },  // AUTO-ADDED (expired)
        { name: "Whipped Pass+", ps: [], plus: ["Whipped Pass"], exp: true, maxRating: 83 },  // AUTO-ADDED (expired)
        { name: "ST Advanced Forward+", ps: [], plus: [], exp: true, pos: "ST", maxRating: 83 },  // AUTO-ADDED (expired)
        { name: "Footwork Phenom", ps: [], plus: [], exp: true, maxRating: 83 },  // AUTO-ADDED (expired)
        { name: "Long Ball Pass", ps: ["Long Ball Pass"], plus: [], exp: true, maxRating: 82 },  // AUTO-ADDED (expired)
        { name: "Relentless Pressure", ps: ["Relentless"], plus: [], exp: true, maxRating: 82 },  // AUTO-ADDED (expired)
        { name: "Complete Connection", ps: ["First Touch"], plus: [], exp: true, pos: "CM", maxRating: 83, ovrBoost: "+2", ovrCap: 84 },  // AUTO-ADDED (expired)
        { name: "One Shot", ps: [], plus: [], exp: true, maxRating: 82 },  // AUTO-ADDED (expired)
        { name: "Passing Prodigy", ps: [], plus: [], exp: true, maxRating: 83 },  // AUTO-ADDED (expired)
        { name: "Striker's Rise", ps: ["Relentless", "Gamechanger", "Power Shot"], plus: [], exp: true, pos: "ST", maxRating: 74, ovrBoost: "+15", ovrCap: 83 },  // AUTO-ADDED (expired)
        { name: "The Debut", ps: [], plus: [], exp: true, pos: "GK", maxRating: 82 },  // AUTO-ADDED (expired)
        { name: "Cover Athlete", ps: ["Relentless"], plus: [], exp: true, pos: "CAM", maxRating: 83, ovrBoost: "+2", ovrCap: 85 },  // AUTO-ADDED (expired)
        { name: "Rising Guard", ps: [], plus: [], exp: true, maxRating: 82 },  // AUTO-ADDED (expired)

           
    
    
    ];

    function init() {
        // Here we can append any simple "N/A" evos from your list that don't need manual mapping
        const additionalNames = [
            "Make the Link", "Future Stars", "5* Skill Moves", "5* Weak Foot", 
            "FS Academy Club Legend Midfielders", "Future Stars Academy LB/RB First XI",
            "Skill Moves Upgrade", "Weak Foot Upgrade", "ST Roles++", "CB Roles++",
            "TOTY Icon", "TOTY Honourable Mentions", "ST to CAM", "CB to CDM"
        ];
        
        additionalNames.forEach(name => {
            if(!rawData.find(e => e.name === name)) {
                rawData.push({ name: name, ps: [], plus: [], exp: true });
            }
        });

        render();
    }

    function msUntil(isoDate) {
        if (!isoDate) return NaN;
        // If it already has a time component, parse directly; otherwise treat as end-of-day UTC
        const target = /T\d/.test(isoDate)
            ? new Date(isoDate)
            : new Date(isoDate + 'T23:59:59Z');
        const ms = target - Date.now();
        return isNaN(ms) ? NaN : ms;
    }

    // True if explicitly marked expired OR expiry date has passed
    function isExpired(evo) {
        if (evo.exp) return true;
        if (evo.expires) {
            return new Date(evo.expires + 'T23:59:59Z') < Date.now();
        }
        return false;
    }

    function daysUntil(isoDate) {
        return Math.ceil(msUntil(isoDate) / (1000 * 60 * 60 * 24));
    }

    function buildExpiryTag(isoDate) {
        const ms = msUntil(isoDate);
        if (isNaN(ms) || ms < 0) return '<span class="status-tag">Expired</span>';
        if (ms < 1000 * 60 * 60 * 24) {
            // Sub-24h: show hours and minutes
            const totalMins = Math.ceil(ms / 60000);
            const hours = Math.floor(totalMins / 60);
            const mins  = totalMins % 60;
            if (hours === 0)  return `<span class="expiry-tag expiry-urgent">⏳ ${mins}m left</span>`;
            if (hours <= 2)   return `<span class="expiry-tag expiry-urgent">⏳ ${hours}h ${mins}m left</span>`;
            return `<span class="expiry-tag expiry-urgent">⏳ ${hours}h left</span>`;
        }
        const days = Math.ceil(ms / (1000 * 60 * 60 * 24));
        if (days <= 2) return `<span class="expiry-tag expiry-urgent">⏳ ${days}d left</span>`;
        return `<span class="expiry-tag">⏳ ${days}d left</span>`;
    }

    // Matches bare playstyle names ("Rapid") AND plus variants ("Rapid+")
    function isPlaystyleNamedEvo(evo) {
        if (evo.name in playstyleMap) return true;
        if (evo.name.endsWith('+') && evo.name.slice(0, -1).trim() in playstyleMap) return true;
        return false;
    }

    // Column sort state: { col: null | string, dir: 1 | -1 }
    // dir 1 = ascending, -1 = descending
    let sortState = { col: null, dir: 1 };

    function sortBy(col) {
        if (col === 'name' && sortState.col === 'name') {
            // Second click on Evolution Name → reset to default page-load order
            sortState.col = null;
            sortState.dir = 1;
        } else if (sortState.col === col) {
            sortState.dir *= -1;  // toggle direction on second click for other columns
        } else {
            sortState.col = col;
            sortState.dir = 1;
        }
        // Update header indicators
        document.querySelectorAll('th.sortable').forEach(th => {
            th.classList.remove('sort-asc', 'sort-desc');
            if (sortState.col && th.dataset.col === sortState.col) {
                th.classList.add(sortState.dir === 1 ? 'sort-asc' : 'sort-desc');
            }
        });
        render();
    }

    // Default order (rawData order preserved within each group — newest synced = top):
    //   1. Normal-named active evos
    //   2. Playstyle-named evos (base + plus variants)
    //   3. Expired evos
    function getSortedData() {
        const normal  = [];
        const psGroup = [];
        const expired = [];

        rawData.forEach(evo => {
            if (isExpired(evo))           { expired.push(evo);  return; }
            if (isPlaystyleNamedEvo(evo)) { psGroup.push(evo);  return; }
            normal.push(evo);
        });

        let data = [...normal, ...psGroup, ...expired];

        if (!sortState.col) return data;

        const col = sortState.col;
        const dir = sortState.dir;

        data.sort((a, b) => {
            let av, bv;
            if (col === 'name') {
                // msUntil respects 6pm UK deadline — smallest value = most urgent
                const getMs = e => {
                    if (e.exp)      return 9000000000000;
                    if (!e.expires) return 8000000000000;
                    return msUntil(e.expires);
                };
                return getMs(a) - getMs(b);
            }
            if (col === 'pos') {
                av = (a.pos || '').toLowerCase();
                bv = (b.pos || '').toLowerCase();
                return dir * av.localeCompare(bv);
            }
            if (col === 'maxRating') {
                // nulls always last regardless of sort direction
                if (!a.maxRating && !b.maxRating) return 0;
                if (!a.maxRating) return 1;
                if (!b.maxRating) return -1;
                return dir * (a.maxRating - b.maxRating);
            }
            if (col === 'ovrBoost') {
                // Sort numerically by boost amount (strip the + sign)
                const toNum = e => e.ovrBoost ? parseInt(e.ovrBoost.replace('+','')) || 0 : 0;
                return dir * (toNum(a) - toNum(b));
            }
            if (col === 'ps') {
                av = a.ps.length;
                bv = b.ps.length;
                return dir * (av - bv);
            }
            if (col === 'plus') {
                av = a.plus.length;
                bv = b.plus.length;
                return dir * (av - bv);
            }
            return 0;
        });

        return data;
    }

    function buildRow(evo) {
        const row = document.createElement('tr');
        row.className = isExpired(evo) ? 'expired-row' : 'active-row';

        const psHTML = evo.ps.length > 0 ? evo.ps.map((p, i) => {
            const d = playstyleMap[p];
            const cap = (evo.psCaps || [])[i];
            const capStr = cap != null ? `<span class="ps-cap">| ${cap}</span>` : '';
            return d ? `<span class="ps-icon-wrap"><img src="${d.folder}/${d.file}_standard.png" class="ps-icon" title="${p}">${capStr}</span>` : `<span>${p}</span>`;
        }).join('') : '<span class="no-data">N/A</span>';

        const plusHTML = evo.plus.length > 0 ? evo.plus.map((p, i) => {
            const d = playstyleMap[p];
            const cap = (evo.plusCaps || [])[i];
            const capStr = cap != null ? `<span class="ps-cap">| ${cap}</span>` : '';
            return d ? `<span class="ps-icon-wrap"><img src="${d.folder}/${d.file}_plus.png" class="ps-icon plus-icon" title="${p}+">${capStr}</span>` : `<span>${p}+</span>`;
        }).join('') : '<span class="no-data">N/A</span>';

        const tag = isExpired(evo)
            ? '<span class="status-tag">Expired</span>'
            : evo.expires
                ? buildExpiryTag(evo.expires)
                : '';

        const posHTML = evo.pos ? `<span class="pos-tag">${evo.pos}</span>` : '<span class="no-data">—</span>';
        // If ovrCap is missing but we have boost + maxRating, compute it (e.g. ≤88 +2 → 90)
        const computedCap = evo.ovrCap
            ? evo.ovrCap
            : (evo.ovrBoost && evo.maxRating
                ? evo.maxRating + parseInt(evo.ovrBoost)
                : null);
        const ratingHTML = evo.maxRating
            ? (computedCap
                ? `<span class="rating-tag">≤ ${evo.maxRating} → ${computedCap}</span>`
                : `<span class="rating-tag">≤ ${evo.maxRating}</span>`)
            : '<span class="no-data">—</span>';
        const boostHTML = evo.ovrBoost ? `<span class="boost-tag">${evo.ovrBoost}</span>` : '<span class="no-data">—</span>';

        row.innerHTML = `
            <td><div class="name-cell"><strong>${evo.name}</strong>${tag}</div></td>
            <td>${posHTML}</td>
            <td>${ratingHTML}</td>
            <td>${boostHTML}</td>
            <td><div class="icon-row">${psHTML}</div></td>
            <td><div class="icon-row">${plusHTML}</div></td>
        `;
        return row;
    }

    function render() {
        const body = document.getElementById('tableBody');
        body.innerHTML = "";
        getSortedData().forEach(evo => body.appendChild(buildRow(evo)));
        filterTable();
    }

    function toggleExpired() {
        hideExpiredState = !hideExpiredState;
        const btn = document.getElementById('toggleBtn');
        btn.innerText = hideExpiredState ? "Show All" : "Hide Expired";
        btn.classList.toggle('active', hideExpiredState);
        filterTable();
    }

    function filterTable() {
        const query = document.getElementById('search').value.toLowerCase().trim();
        const rows = document.getElementById('tableBody').getElementsByTagName('tr');
        const sorted = getSortedData();

        const isPlusSearch = query.endsWith('+');
        const term = isPlusSearch ? query.slice(0, -1).trim() : query;

        sorted.forEach((evo, index) => {
            const row = rows[index];
            if (!row) return;
            let matchesSearch = false;

            if (isPlusSearch) {
                matchesSearch = evo.name.toLowerCase().includes(query) ||
                                evo.plus.some(p => p.toLowerCase().includes(term));
            } else {
                matchesSearch = evo.name.toLowerCase().includes(query) ||
                                evo.ps.some(p => p.toLowerCase().includes(query)) ||
                                evo.plus.some(p => p.toLowerCase().includes(query));
            }

            const matchesExpiry = hideExpiredState ? !isExpired(evo) : true;
            row.style.display = (matchesSearch && matchesExpiry) ? "" : "none";
        });
    }

    init();
// Add this at the very bottom of your script to press hide all Expired 
document.getElementById('toggleBtn').click();


</script>
